<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahara Match | Job post assistant</title>
  <style>
    :root { color-scheme: light; --ink: #182520; --muted: #61716a; --paper: #f5f3ec; --panel: #fffefa; --line: #d8ddd5; --green: #176b50; --orange: #e47c45; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 Georgia, "Times New Roman", serif; }
    main { display: grid; grid-template-columns: minmax(220px, 0.7fr) minmax(320px, 1.3fr); min-height: 100vh; max-width: 1280px; margin: auto; }
    aside { padding: 40px clamp(22px, 4vw, 56px); background: #e8eee7; border-right: 1px solid var(--line); }
    .brand { color: var(--green); font: 700 13px/1.2 system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { max-width: 8ch; margin: 64px 0 18px; font-size: clamp(38px, 5vw, 62px); line-height: 0.98; font-weight: 500; }
    aside p { color: var(--muted); max-width: 30ch; }
    #start { margin-top: 24px; padding: 12px 18px; border: 0; background: var(--green); color: white; font: 600 15px system-ui, sans-serif; cursor: pointer; }
    section { display: flex; flex-direction: column; min-height: 100vh; padding: 28px clamp(18px, 4vw, 52px); }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--line); font: 600 13px system-ui, sans-serif; }
    #login-form { display: flex; gap: 6px; }
    #login-form input { width: min(170px, 20vw); min-width: 0; padding: 8px; border: 1px solid var(--line); background: var(--panel); }
    #login-form button { padding: 8px 10px; font-size: 12px; }
    #status { color: var(--muted); font-weight: 400; }
    #messages { flex: 1; overflow: auto; padding: 24px 0; }
    .message { max-width: min(86%, 620px); margin: 0 0 14px; padding: 14px 17px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; }
    .message.user { margin-left: auto; border-color: #b8d5c7; background: #e1eee7; }
    form { display: flex; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
    textarea { flex: 1; min-height: 52px; max-height: 160px; resize: vertical; padding: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
    #draft-editor { width: 100%; min-height: 320px; margin-top: 12px; padding: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 13px/1.5 ui-monospace, Consolas, monospace; }
    #save-draft { min-height: 42px; margin: 10px 0 18px; }
    button { padding: 0 18px; border: 0; background: var(--orange); color: #211d17; font: 700 14px system-ui, sans-serif; cursor: pointer; }
    button:disabled, textarea:disabled { opacity: 0.55; cursor: default; }
    pre { overflow: auto; padding: 16px; border-left: 3px solid var(--green); background: var(--panel); font-size: 13px; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } aside { padding: 22px; border-right: 0; border-bottom: 1px solid var(--line); } h1 { margin: 24px 0 10px; font-size: 42px; } aside p { margin: 8px 0; } #start { margin-top: 14px; } section { min-height: 70vh; padding: 18px; } header { align-items: flex-start; flex-direction: column; } #login-form { width: 100%; } #login-form input { width: auto; flex: 1; } }
  </style>
</head>
<body>
  <main>
    <aside>
      <div class="brand">Mahara Match · Espace recruteur</div>
      <h1>Votre offre, construite ensemble.</h1>
      <p>Répondez en français ou en derja. Vous pouvez passer une question; les informations manquantes resteront à compléter.</p>
      <button id="start" type="button">Commencer une offre</button>
    </aside>
    <section aria-label="Conversation">
      <header>
        <span>Assistant de rédaction · <span id="status">Connectez-vous</span></span>
        <form id="login-form"><input id="email" type="email" placeholder="E-mail professionnel" autocomplete="username" required><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button>Connexion</button></form>
      </header>
      <div id="messages" aria-live="polite"></div>
      <form id="reply-form"><textarea id="reply" placeholder="Votre réponse…" aria-label="Votre réponse" disabled></textarea><button id="send" disabled>Envoyer</button></form>
      <div id="draft"></div>
    </section>
  </main>
  <script>
    let sessionId = null;
    let accessToken = sessionStorage.getItem('employer_access_token');
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#reply');
    const send = document.querySelector('#send');
    const draft = document.querySelector('#draft');
    async function apiFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set('Authorization', `Bearer ${accessToken}`);
      return fetch(url, { ...options, headers });
    }
    function render(data) {
      messages.replaceChildren(...data.messages.map(item => {
        const node = document.createElement('div');
        node.className = `message ${item.role === 'user' ? 'user' : ''}`;
        node.textContent = item.content;
        return node;
      }));
      messages.scrollTop = messages.scrollHeight;
      const ready = data.complete && data.draft;
      document.querySelector('#status').textContent = ready ? 'Brouillon prêt à relire' : data.complete ? 'Informations à compléter' : 'En cours';
      if (data.complete) { input.disabled = true; send.disabled = true; }
      if (data.draft) {
        const editor = document.createElement('textarea');
        editor.id = 'draft-editor';
        editor.setAttribute('aria-label', 'Offre d’emploi au format JSON');
        editor.value = JSON.stringify(data.draft, null, 2);
        const save = document.createElement('button');
        save.id = 'save-draft';
        save.type = 'button';
        save.textContent = 'Enregistrer le brouillon';
        save.addEventListener('click', async () => {
          let editedDraft;
          try { editedDraft = JSON.parse(editor.value); }
          catch { document.querySelector('#status').textContent = 'JSON invalide'; return; }
          save.disabled = true;
          const response = await apiFetch(`/employer-agent/sessions/${sessionId}/draft`, {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ draft: editedDraft })
          });
          if (!response.ok) {
            const error = await response.json();
            document.querySelector('#status').textContent = typeof error.detail === 'string' ? 'Offre invalide: ' + error.detail : 'Offre invalide';
            save.disabled = false;
            return;
          }
          const updated = await response.json();
          document.querySelector('#status').textContent = 'Brouillon enregistré';
          render(updated);
        });
        draft.replaceChildren(editor, save);
      } else if (data.missing_fields?.length) {
        draft.textContent = `À compléter : ${data.missing_fields.join(', ')}`;
      }
    }
    document.querySelector('#start').addEventListener('click', async () => {
      if (!accessToken) { document.querySelector('#status').textContent = 'Connectez-vous pour commencer'; return; }
      const response = await apiFetch('/employer-agent/sessions', { method: 'POST' });
      if (response.status === 401) { document.querySelector('#status').textContent = 'Connectez-vous pour commencer'; return; }
      if (!response.ok) { document.querySelector('#status').textContent = 'Impossible de démarrer'; return; }
      const data = await response.json();
      sessionId = data.id;
      input.disabled = false; send.disabled = false; input.focus(); render(data);
    });
    document.querySelector('#reply-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (!sessionId || !input.value.trim()) return;
      const message = input.value.trim(); input.value = ''; send.disabled = true;
      const response = await apiFetch(`/employer-agent/sessions/${sessionId}/messages`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message })
      });
      if (!response.ok) { document.querySelector('#status').textContent = 'Réessayez votre réponse'; send.disabled = false; return; }
      render(await response.json());
      if (!input.disabled) send.disabled = false;
    });
    async function restoreSession() {
      if (!accessToken) return;
      const response = await apiFetch('/employer-agent/sessions');
      if (!response.ok) return;
      const sessions = await response.json();
      if (!sessions.length) { document.querySelector('#status').textContent = 'Connecté'; return; }
      const latest = sessions.find(session => !session.complete) || sessions[0];
      sessionId = latest.id;
      input.disabled = latest.complete;
      send.disabled = latest.complete;
      render(latest);
    }
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/employers/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.querySelector('#email').value, password: document.querySelector('#password').value })
      });
      if (!response.ok) { document.querySelector('#status').textContent = 'Identifiants invalides'; return; }
      accessToken = (await response.json()).access_token;
      sessionStorage.setItem('employer_access_token', accessToken);
      document.querySelector('#password').value = '';
      document.querySelector('#status').textContent = 'Connecté';
      await restoreSession();
    });
    restoreSession();
  </script>
</body>
</html>
