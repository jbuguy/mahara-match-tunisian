[project]
name = "mahara-employer-agent"
version = "0.1.0"
description = "WP4 conversational employer job-post drafting agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "mahara-data>=0.1.0",
    "mahara-shared-llm>=0.1.0",
    "pydantic>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["employer_agent_wp4*"]

[tool.setuptools.package-data]
employer_agent_wp4 = ["templates/*.html", "static/*.html", "static/assets/*"]