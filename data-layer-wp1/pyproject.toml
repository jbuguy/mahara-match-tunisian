[project]
name = "mahara-data"
version = "0.1.0"
description = "WP1 shared data layer: ORM models, JSON contracts and reference data"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.9,<3.0",
    "pgvector>=0.3,<1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = ["pytest>=8.0,<9.0", "pglast>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mahara_data*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
