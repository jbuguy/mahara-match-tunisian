services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mahara_match}
      POSTGRES_USER: ${POSTGRES_USER:-mahara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahara}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mahara} -d ${POSTGRES_DB:-mahara_match}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: