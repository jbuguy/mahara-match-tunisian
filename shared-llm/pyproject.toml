[project]
name = "mahara-shared-llm"
version = "0.1.0"
description = "Shared OpenAI-compatible LLM client for Mahara Match work packages"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared_llm*"]