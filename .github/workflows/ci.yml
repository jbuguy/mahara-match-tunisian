name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: mahara_match
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mahara_match"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mahara_match
      JWT_SECRET_KEY: ci-only-signing-key-never-use-in-production-0000
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie
        env:
          POSTGRES_DB: mahara_match
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mahara_match"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mahara_match
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Migrate a fresh database to head
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Prepare an existing database at the previous revision
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mahara_match -v ON_ERROR_STOP=1 -c "CREATE DATABASE mahara_match_upgrade"
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/mahara_match_upgrade python -m alembic -c backend/alembic.ini upgrade 0019_missions_and_proposals
      - name: Upgrade the existing database to head
        run: |
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/mahara_match_upgrade python -m alembic -c backend/alembic.ini upgrade head
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/mahara_match_upgrade python -m alembic -c backend/alembic.ini current

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
